    <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />

    <link rel="apple-touch-icon" href="/pwa-icon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Quick IMS - Inventory & POS" />

  <body class="bg-slate-50 dark:bg-slate-950 select-none md:select-auto antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically unregister any legacy service workers and clear stale caches to ensure single React instance
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].indexOf('quickims') !== -1) {
              caches.delete(keys[i]);
            }
          }
        }).catch(function() {});
      }
    </script>
  </body>
