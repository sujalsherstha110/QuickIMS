name: Build Windows Desktop App (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck application
        run: npm run lint

      - name: Build offline bundle and Windows .exe installers
        run: npm run dist:win

      - name: Upload Windows .exe installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quick-IMS-Windows-Installers
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Attach .exe installers to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          generate_release_notes: true
